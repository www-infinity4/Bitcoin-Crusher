<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitcoin Crusher Token Network</title>
<style>body{margin:0;background:#070918;color:#f4f6ff;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:22px}h1{color:#f4c95d}.legend,.grid{display:flex;gap:10px;flex-wrap:wrap}.legend span,.node{border:1px solid #39416f;border-radius:12px;padding:10px;background:#11152d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.node{border-left:8px solid var(--color)}button,.word{background:#273a85;color:white;border:1px solid #5870d0;border-radius:8px;padding:7px 9px;margin:4px;cursor:pointer}.route{background:#7f1d1d;border-color:#dc2626}.engineer{background:#14532d;border-color:#16a34a}.word{display:inline-block;padding:2px 5px;margin:1px;border-color:var(--word);background:color-mix(in srgb,var(--word) 25%,#11152d)}.neutral{color:#d7dbed}.meta{color:#aab2d2;font-size:12px}code{overflow-wrap:anywhere;color:#61d9ff}a{color:#61d9ff}</style></head><body><main>
<a href="index.html">← Bitcoin Crusher</a><h1>Color-Coded Research Token Network</h1><p>Meaningful words are clickable and colored by function. Red routes grow when tokens share terms or sources and people click through. Catalog/link value is not money and does not prove a scientific claim.</p><div class="legend" id="legend"></div><h2>Tokens</h2><div class="grid" id="grid"></div><h2>Z storage exchange</h2><button id="export">Export Z graph</button><input type="file" id="import" accept="application/json"><p class="meta" id="status"></p>
</main><script src="assets/token-graph.js"></script><script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function words(n){return TOKEN_GRAPH.wordMode(n).map(w=>w.neutral?'<span class="neutral">'+esc(w.text)+'</span>':'<button class="word" style="--word:'+w.color+'" data-word="'+esc(w.word)+'" data-token="'+n.tokenNumber+'">'+esc(w.text)+'</button>').join("")}
function render(){const G=TOKEN_GRAPH.load();document.getElementById("legend").innerHTML=Object.entries(TOKEN_GRAPH.COLORS).map(([name,v])=>'<span style="border-left:8px solid '+v.color+'"><b>'+name+'</b> · '+v.meaning+'</span>').join("");document.getElementById("grid").innerHTML=Object.values(G.nodes).sort((a,b)=>b.tokenValue-a.tokenValue).map(n=>'<article class="node" style="--color:'+n.tokenColor+'"><b>'+esc(n.title)+'</b><div class="meta">'+n.tokenFunction+' · catalog value '+n.tokenValue+'</div><code>'+esc(n.tokenNumber)+'</code><p>'+words(n)+'</p><button class="engineer" data-engineer="'+n.tokenNumber+'">Engineering output</button><div>'+TOKEN_GRAPH.related(n.tokenNumber).slice(0,6).map(x=>'<button class="route" data-from="'+n.tokenNumber+'" data-to="'+x.node.tokenNumber+'">Route → '+esc(x.node.title.slice(0,35))+' · '+x.edge.strength+'</button>').join("")+'</div></article>').join("")||'<p>No research tokens yet. Enter words and spin in Bitcoin Crusher first.</p>';document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{TOKEN_GRAPH.recordClick(b.dataset.from,b.dataset.to);render()});document.querySelectorAll('[data-engineer]').forEach(b=>b.onclick=()=>{TOKEN_GRAPH.promoteEngineering(b.dataset.engineer);render()});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const rel=TOKEN_GRAPH.related(b.dataset.token).find(x=>(x.edge.sharedKeywords||[]).includes(b.dataset.word));if(rel){TOKEN_GRAPH.recordClick(b.dataset.token,rel.node.tokenNumber,b.dataset.word);render()}})}
document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([TOKEN_GRAPH.exportZ()],{type:"application/json"}));a.href=u;a.download="z-token-graph.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),200)};document.getElementById("import").onchange=async e=>{try{TOKEN_GRAPH.importZ(await e.target.files[0].text());document.getElementById("status").textContent="Z graph imported.";render()}catch(err){document.getElementById("status").textContent="Import failed: "+err.message}};render();
</script></body></html>
