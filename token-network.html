<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitcoin Crusher Token Network</title>
<style>body{margin:0;background:#070918;color:#f4f6ff;font:15px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:22px}h1{color:#f4c95d}.legend,.grid{display:flex;gap:10px;flex-wrap:wrap}.legend span,.node{border:1px solid #39416f;border-radius:12px;padding:10px;background:#11152d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.node{border-left:8px solid var(--color)}button{background:#273a85;color:white;border:1px solid #5870d0;border-radius:8px;padding:7px 9px;margin:4px;cursor:pointer}.meta{color:#aab2d2;font-size:12px}code{overflow-wrap:anywhere;color:#61d9ff}a{color:#61d9ff}</style></head><body><main>
<a href="index.html">← Bitcoin Crusher</a><h1>Color-Coded Research Token Network</h1><p>Links grow when tokens share research terms or sources. Click-throughs strengthen the knowledge relationship and catalog value; they do not create money or prove a scientific claim.</p><div class="legend" id="legend"></div><h2>Tokens</h2><div class="grid" id="grid"></div><h2>Z storage exchange</h2><button id="export">Export Z graph</button><input type="file" id="import" accept="application/json"><p class="meta" id="status"></p>
</main><script src="assets/token-graph.js"></script><script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let active=null;
function render(){const G=TOKEN_GRAPH.load();document.getElementById("legend").innerHTML=TOKEN_GRAPH.STAGES.map(s=>'<span style="border-left:8px solid '+s.color+'">'+s.name+' · '+s.min+'+</span>').join("");document.getElementById("grid").innerHTML=Object.values(G.nodes).sort((a,b)=>b.tokenValue-a.tokenValue).map(n=>'<article class="node" style="--color:'+n.tokenColor+'"><b>'+esc(n.title)+'</b><div class="meta">'+n.stage+' · catalog value '+n.tokenValue+'</div><code>'+esc(n.tokenNumber)+'</code><p>'+esc(n.userInput)+'</p><div>'+TOKEN_GRAPH.related(n.tokenNumber).slice(0,6).map(x=>'<button data-from="'+n.tokenNumber+'" data-to="'+x.node.tokenNumber+'">'+esc(x.node.title.slice(0,35))+' · '+x.edge.strength+'</button>').join("")+'</div></article>').join("")||'<p>No research tokens yet. Enter words and spin in Bitcoin Crusher first.</p>';document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{TOKEN_GRAPH.recordClick(b.dataset.from,b.dataset.to);active=b.dataset.to;render()})}
document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([TOKEN_GRAPH.exportZ()],{type:"application/json"}));a.href=u;a.download="z-token-graph.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),200)};document.getElementById("import").onchange=async e=>{try{TOKEN_GRAPH.importZ(await e.target.files[0].text());document.getElementById("status").textContent="Z graph imported.";render()}catch(err){document.getElementById("status").textContent="Import failed: "+err.message}};render();
</script></body></html>
